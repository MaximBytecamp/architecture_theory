    <p class="lead">Не короткая шпаргалка, а разбор: откуда взялся каждый подход, какую боль он лечит, как устроен и — главное — когда его стоит и не стоит выбирать. С диаграммами и примерами кода.</p>
    <div class="hero-stats">${stats.map(s=>`<div class="stat"><div class="num">${s[0]}</div><div class="lbl">${s[1]}</div></div>`).join('')}</div>
    <div class="intro-note"><strong>Как читать атлас.</strong> Архитектуры живут на разных уровнях: системные решают, из каких частей состоит вся система; уровень приложения — как организован код внутри одной части; мобильные — специфика Android/iOS. Эти уровни не конкурируют, а дополняют друг друга: реальный проект обычно сочетает несколько (например, микросервисы + внутри каждого слои + гексагональное ядро). Если не знаете, с чего начать — откройте раздел <strong>«Как выбирать»</strong>.</div>
    ${cats}</div>`;
}

/* ====== СТАТЬЯ ====== */
function fb(x){const i=x.indexOf('||');return i<0?`<li>${x}</li>`:`<li><span class="ft">${x.slice(0,i)}</span><span class="fexp">${x.slice(i+2)}</span></li>`}
function renderArticle(d){
  const pos=ALL.indexOf(d), prev=pos>0?ALL[pos-1]:null, next=pos<ALL.length-1?ALL[pos+1]:null;
  const proseHtml=d.sections.map(s=>`<h5 class="sub">${s.h}</h5>${s.p.map(p=>`<p>${p}</p>`).join('')}`).join('');
  return `<div class="page active">
    <div class="art-head">
      <div class="art-accent" style="background:${d.cc}"></div>
      <div class="cat" style="color:${d.cc}">${d.cat}</div>
      <h2>${d.name}</h2>
      <p class="tagline">${d.tagline}</p>
    </div>

    <section class="block"><div class="prose">${proseHtml}</div></section>

    ${d.analogy?`<section class="block">
      <div class="section-label"><h4>Простыми словами</h4><div class="ln"></div></div>
      <div class="analogy"><span class="tag">Аналогия из жизни</span><p>${d.analogy}</p></div>
    </section>`:''}

    ${d.realworld?`<section class="block">
      <div class="section-label"><h4>Где это работает в реальности</h4><div class="ln"></div></div>
      <div class="realworld">${d.realworld.map(r=>`<div class="rw-card"><div class="who">${r.who}</div><div class="what">${r.what}</div></div>`).join('')}</div>
    </section>`:''}

    <section class="block">
      <div class="section-label"><h4>Визуализация структуры</h4><div class="ln"></div></div>
      <div class="diagram">${DIAG[d.diag]}<div class="cap">▲ ${d.dcap}</div></div>
    </section>

    <section class="block">
      <div class="section-label"><h4>Сильные и слабые стороны</h4><div class="ln"></div></div>
      <div class="two-col">
        <div class="feat good"><h5>Преимущества</h5><ul>${d.good.map(x=>fb(x)).join('')}</ul></div>
        <div class="feat bad"><h5>Недостатки и риски</h5><ul>${d.bad.map(x=>fb(x)).join('')}</ul></div>
      </div>
    </section>

    <section class="block">
      <div class="section-label"><h4>Когда выбирать этот подход</h4><div class="ln"></div></div>
      <div class="choose">
        <div class="box yes"><h5>Подойдёт, если</h5><ul>${d.when.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="box no"><h5>Лучше не брать, если</h5><ul>${d.avoid.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </section>

    <section class="block">
      <div class="section-label"><h4>Пример кода</h4><div class="ln"></div></div>
      <div class="code-wrap">
        <div class="code-top"><div class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></div><span class="fname">${d.code.file}</span><span class="lang">${d.code.lang}</span></div>
        <pre><code>${d.code.body}</code></pre>
      </div>
      <div class="callout"><span class="ico">ПРИНЦИП</span><p>${d.note}</p></div>
    </section>

    <div class="footer-nav">
      ${prev?`<button class="fnav-btn" onclick="go('${prev.id}')"><small>← ПРЕДЫДУЩИЙ</small><span>${prev.name}</span></button>`:`<button class="fnav-btn" onclick="go('home')"><small>←</small><span>На главную</span></button>`}
      ${next?`<button class="fnav-btn next" onclick="go('${next.id}')"><small>СЛЕДУЮЩИЙ →</small><span>${next.name}</span></button>`:`<button class="fnav-btn next" onclick="go('compare')"><small>ДАЛЬШЕ →</small><span>Как выбирать</span></button>`}
    </div>
  </div>`;
}

/* ====== СТРАНИЦА СРАВНЕНИЯ ====== */
function lvl(v){const m={h:'высокая',m:'средняя',l:'низкая'};return `<span class="lvl ${v}">${m[v]}</span>`}
function renderCompare(){
  // [name, id, сложность, масштабируемость, тестируемость, порог входа, когда]
  const rows=[
   ['Монолит','monolith','l','m','m','l','Старт, MVP, малые команды'],
   ['Многослойная','layered','l','m','m','l','Стандартные бизнес-приложения'],
   ['Микроядро','microkernel','m','m','m','m','Продукты с плагинами/кастомизацией'],
   ['Микросервисы','micro','h','h','m','h','Крупные системы, много команд'],
   ['SOA','soa','h','m','m','h','Интеграция legacy на предприятии'],
   ['Событийная','event','h','h','m','h','Реактивные системы реального времени'],
   ['Конвейер','pipeline','l','h','h','l','Обработка данных, ETL, компиляторы'],
   ['MVC','mvc','l','m','m','l','Серверные веб-приложения'],
   ['Гексагональная','hex','m','m','h','m','Сложный домен, сменные технологии'],
   ['Onion / Clean','onion','m','m','h','m','Крупные долгоживущие приложения'],
   ['CQRS','cqrs','h','h','m','h','Перекос чтения над записью'],
   ['BFF','bff','m','m','m','m','Несколько разных клиентов'],
   ['Serverless','serverless','m','h','m','m','Нерегулярная событийная нагрузка'],
   ['MVP (mobile)','mvp','l','—','m','l','Поддержка существующих Android-проектов'],
   ['MVVM (mobile)','mvvm','m','—','h','m','Новые Android/iOS, Compose/SwiftUI'],
   ['MVI (mobile)','mvi','m','—','h','h','Сложные экраны, единое состояние'],
   ['Clean (mobile)','cleanmob','m','—','h','m','Средние/крупные мобильные приложения'],
  ];
  const body=rows.map(r=>`<tr onclick="go('${r[1]}')" style="cursor:pointer">
    <td>${r[0]}</td><td>${lvl(r[2])}</td><td>${r[3]==='—'?'<span style="color:var(--ink-dim)">—</span>':lvl(r[3])}</td>
    <td>${lvl(r[4])}</td><td>${lvl(r[5])}</td><td style="color:var(--ink-soft);font-weight:400">${r[6]}</td></tr>`).join('');
  return `<div class="page active">
    <div class="art-head"><div class="art-accent" style="background:var(--acc-5)"></div>
      <div class="cat" style="color:var(--acc-5)">Навигатор</div>
      <h2>Как выбирать архитектуру</h2>
      <p class="tagline">Не существует «лучшей» архитектуры — есть подходящая под контекст. Ниже — ориентиры и быстрое сравнение всех подходов атласа.</p></div>

    <section class="block"><div class="prose">
      <h5 class="sub">Три вопроса перед выбором</h5>
      <p><strong>Какой масштаб и команда?</strong> Маленький проект и команда — начинайте с простого (монолит, слои, MVC; для мобильных — MVVM). Сложность архитектуры должна расти вслед за реальной потребностью, а не опережать её.</p>
      <p><strong>Что именно болит?</strong> Архитектура — это лекарство от конкретной боли. Долгие релизы и мешающие друг другу команды → микросервисы. Логика тонет в инфраструктуре → гексагональная/Clean. Чтение душит запись → CQRS. Нет боли — не вводите сложность «на будущее».</p>
      <p><strong>Можно ли комбинировать?</strong> Да, и почти всегда так и делают. Уровни дополняют друг друга: система из микросервисов, где каждый сервис внутри многослойный с гексагональным ядром и событийным общением между сервисами. Выбор — это не «или-или», а набор решений на разных уровнях.</p>
      <h5 class="sub">Главное правило эволюции</h5>
      <p>Начинайте проще, чем кажется нужным, и усложняйте по мере роста боли. Большинство провалов в архитектуре — это не «взяли слишком простое», а «взяли слишком сложное слишком рано»: команда тонет в инфраструктуре вместо того, чтобы делать продукт.</p>
    </div></section>

    <section class="block">
      <div class="section-label"><h4>Сравнительная таблица</h4><div class="ln"></div></div>
      <div class="cmp-wrap"><table class="cmp">
        <thead><tr><th>Подход</th><th>Сложность</th><th>Масштабируемость</th><th>Тестируемость</th><th>Порог входа</th><th>Когда уместен</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      <div class="callout"><span class="ico">СОВЕТ</span><p>Клик по строке открывает подробную статью. «Сложность» и «порог входа» — это цена; платите её только когда она окупается масштабом и реальными требованиями.</p></div>
    </section>
  </div>`;
}

/* ====== РОУТЕР ====== */
function go(id){
  cur=id;
  if(id==='home'){content.innerHTML=renderHome();setCrumb('<b>Главная</b>');setProg(0)}
  else if(id==='compare'){content.innerHTML=renderCompare();setCrumb('Навигатор / <b>Как выбирать</b>');setProg(0)}
  else{const d=ALL.find(x=>x.id===id);content.innerHTML=renderArticle(d);
    setCrumb(`${d.cat} / <b>${d.name}</b>`);setProg(ALL.indexOf(d)+1)}
  buildNav(searchEl.value);
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}
function setCrumb(h){document.getElementById('crumb').innerHTML='Атлас / '+h}
function setProg(n){document.getElementById('ptext').textContent=`${n} / ${ALL.length}`;document.getElementById('pbar').style.width=(n/ALL.length*100)+'%'}
function cardGlow(e,el){const r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px')}
searchEl.addEventListener('input',e=>buildNav(e.target.value));

buildNav();go('home');
</script>
</body>
</html>
